<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Direccion - UTXJ</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="header-utxj">
    <h1>Portal de Direccion de Carrera</h1>
    <p>Validacion Final y Emision de Folios de Justificante</p>
  </div>
  <div class="container">
    <div class="card">
      <h2>Solicitudes Pre-Aprobadas por Tutor</h2>
      <div id="pendientes-direccion"></div>
    </div>
  </div>
  <script>
    const token = localStorage.getItem('token');
    async function cargarPendientes() {
      const res = await fetch('/api/justificantes/direccion/pendientes', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      const cont = document.getElementById('pendientes-direccion');
      cont.innerHTML = '';
      if (data.length === 0) { cont.innerHTML = '<p>No hay solicitudes pendientes.</p>'; return; }
      data.forEach(j => {
        cont.innerHTML += `
          <div style="border: 1px solid #ddd; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
            <h3>Alumno: ${j.Alumno?.nombre} ${j.Alumno?.apellidos} (${j.Alumno?.grado_grupo})</h3>
            <p><b>Evidencia:</b> <a href="${j.documento_comprobatorio_url}" target="_blank">Ver Receta</a></p>
            <button onclick="validarFinal(${j.id_justificante}, true)">Validar y Generar Folio Oficial</button>
            <button onclick="validarFinal(${j.id_justificante}, false)" style="background-color: #ef4444; color: white;">Rechazar</button>
          </div>
        `;
      });
    }
    async function validarFinal(id, validar) {
      let motivo_rechazo = '';
      if (!validar) { motivo_rechazo = prompt('Motivo del rechazo:'); if (!motivo_rechazo) return; }
      const res = await fetch(`/api/justificantes/direccion/dictamen/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ validar, motivo_rechazo })
      });
      if (res.ok) { alert('Procesado exitosamente'); cargarPendientes(); }
    }
    cargarPendientes();
  </script>
</body>
</html>
